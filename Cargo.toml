[package]
name = "sel"
version = "0.1.0"
edition = "2024"
authors = ["MarcosAndradeV <mastermarcos1212@hotmail.com>"]
description = "A fast, embeddable, and extensible Scheme-like Lisp dialect in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MarcosAndradeV/sel"
homepage = "https://github.com/MarcosAndradeV/sel"
keywords = ["lisp", "scheme", "interpreter", "embeddable", "ffi"]
categories = ["development-tools", "compilers"]

[lib]
name = "sel"
path = "src/lib.rs"

[[bin]]
name = "sel"
path = "src/main.rs"

[features]
default = ["ffi"]
ffi = ["dep:libloading", "dep:libffi"]

[dependencies]
rustyline = "18.0.0"
libloading = { version = "0.9.0", optional = true }
libffi = { version = "5.1.0", optional = true }
rustc-hash = "2.1.2"
indexmap = "2.14.0"
imbl = { version = "7.0.2", git = "https://github.com/MarcosAndradeV/imbl" }
